# Local development: `docker compose up db` for just Postgres,
# or `docker compose --profile app up --build` to run the full app at http://localhost:8080.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Library: Host=db;Port=5432;Database=library;Username=library;Password=library
      Admin__Email: admin@example.com
      Admin__Password: changeme123
    ports:
      - "8080:8080"
    profiles: ["app"]

volumes:
  pgdata:
